name: Build Trendy Wear BD APK

on:
  workflow_dispatch:
  push:
    paths:
      - "TrendyWearBD-AndroidStudio.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          rm -rf TrendyWearBD-AndroidStudio
          unzip -q TrendyWearBD-AndroidStudio.zip
          test -f TrendyWearBD-AndroidStudio/settings.gradle.kts

      - name: Fix Android build configuration
        working-directory: TrendyWearBD-AndroidStudio
        run: |
          sed -i '/WebView.setWebContentsDebuggingEnabled(BuildConfig.DEBUG)/d' app/src/main/java/com/trendywearbd/app/MainActivity.kt

      - name: Build Debug APK
        working-directory: TrendyWearBD-AndroidStudio
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrendyWearBD-APK
          path: TrendyWearBD-AndroidStudio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
